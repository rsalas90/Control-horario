<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control horario</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  margin:0;
  background:#f3f4f6;
  color:#111;
}
.wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
}
h1{
  font-size:26px;
  margin-bottom:6px;
}
.sub{
  color:#666;
  margin-bottom:18px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
label{
  display:block;
  font-size:14px;
  color:#555;
  margin-bottom:5px;
}
input,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:17px;
  background:white;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  font-size:17px;
}
.primary{
  background:#111;
  color:white;
}
.secondary{
  background:#e9eaec;
}
.danger{
  background:#f7dede;
  color:#7c1111;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  background:#f6f6f7;
  border-radius:12px;
  padding:12px;
  text-align:center;
  font-size:13px;
}
.stat b{
  display:block;
  margin-top:5px;
  font-size:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:9px 5px;
  border-bottom:1px solid #eee;
  text-align:left;
}
.small{
  color:#666;
  font-size:13px;
}
@media(max-width:600px){
  .grid,.stats{
    grid-template-columns:1fr;
  }
  table{
    font-size:12px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<h1>Control horario</h1>
<div class="sub">
Horario habitual: 11:30–20:30
</div>

<div class="card">

<div class="grid">

<div>
<label>Fecha</label>
<input id="fecha" type="date">
</div>

<div>
<label>Tarifa extra €/hora</label>
<input id="tarifa" type="number" value="7" step="0.01">
</div>

<div>
<label>Hora de llegada</label>
<input id="entrada" type="time">
</div>

<div>
<label>Hora de salida</label>
<input id="salida" type="time">
</div>

</div>

<button class="primary" onclick="guardar()">
Guardar jornada
</button>

</div>

<div class="card">

<label>Mes</label>
<select id="mes" onchange="mostrar()"></select>

<div class="stats">

<div class="stat">
Extra acumulado
<b id="extraTotal">0:00</b>
</div>

<div class="stat">
Debe acumulado
<b id="debeTotal">0:00</b>
</div>

<div class="stat">
Extra a pagar
<b id="pagoTotal">0,00 €</b>
</div>

</div>

</div>

<div class="card">

<h3>Histórico del mes</h3>

<div style="overflow:auto">

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Llegada</th>
<th>Salida</th>
<th>Extra</th>
<th>Debe</th>
<th>€</th>
<th></th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<div class="card">

<button class="secondary" onclick="exportar()">
Exportar copia
</button>

<button class="danger" onclick="borrarTodo()">
Borrar todos los datos
</button>

<div class="small" style="margin-top:12px">
Los datos se guardan únicamente en este navegador.
</div>

</div>

</div>

<script>

const CLAVE="controlHorarioHogar_v2";

function minutos(hora){
  const p=hora.split(":").map(Number);
  return p[0]*60+p[1];
}

function hhmm(min){
  min=Math.max(0,Math.round(min));
  const h=Math.floor(min/60);
  const m=min%60;
  return h+":"+String(m).padStart(2,"0");
}

function euro(x){
  return x.toLocaleString(
    "es-ES",
    {style:"currency",currency:"EUR"}
  );
}

function datos(){
  try{
    return JSON.parse(localStorage.getItem(CLAVE)||"[]");
  }catch{
    return [];
  }
}

function guardarDatos(d){
  localStorage.setItem(CLAVE,JSON.stringify(d));
}

function mesClave(fecha){
  return fecha.slice(0,7);
}

function nombreMes(clave){
  const [a,m]=clave.split("-");
  const nombres=[
    "enero","febrero","marzo","abril","mayo","junio",
    "julio","agosto","septiembre","octubre","noviembre","diciembre"
  ];
  return nombres[Number(m)-1]+" "+a;
}

function guardar(){

  const fecha=document.getElementById("fecha").value;
  const entrada=document.getElementById("entrada").value;
  const salida=document.getElementById("salida").value;
  const tarifa=parseFloat(
    document.getElementById("tarifa").value||0
  );

  if(!fecha||!entrada||!salida){
    alert("Completa fecha, llegada y salida");
    return;
  }

  const e=minutos(entrada);
  const s=minutos(salida);

  const inicio=minutos("11:30");
  const fin=minutos("20:30");

  if(s<=e){
    alert("La salida debe ser posterior a la llegada");
    return;
  }

  let extra=0;
  let debe=0;

  if(e<inicio){
    extra += inicio-e;
  }else if(e>inicio){
    debe += e-inicio;
  }

  if(s>fin){
    extra += s-fin;
  }else if(s<fin){
    debe += fin-s;
  }

  const importe=(extra/60)*tarifa;

  const d=datos();

  d.push({
    id:Date.now(),
    fecha,
    entrada,
    salida,
    extra,
    debe,
    tarifa,
    importe
  });

  d.sort((a,b)=>
    a.fecha.localeCompare(b.fecha) ||
    a.entrada.localeCompare(b.entrada)
  );

  guardarDatos(d);

  actualizarMeses();

  document.getElementById("mes").value=mesClave(fecha);

  mostrar();

  document.getElementById("entrada").value="";
  document.getElementById("salida").value="";
}

function actualizarMeses(){

  const d=datos();

  let meses=[...new Set(
    d.map(x=>mesClave(x.fecha))
  )];

  const actual=new Date().toISOString().slice(0,7);

  if(!meses.includes(actual)){
    meses.push(actual);
  }

  meses.sort().reverse();

  const sel=document.getElementById("mes");

  const anterior=sel.value;

  sel.innerHTML="";

  meses.forEach(m=>{
    const op=document.createElement("option");
    op.value=m;
    op.textContent=nombreMes(m);
    sel.appendChild(op);
  });

  if(meses.includes(anterior)){
    sel.value=anterior;
  }else{
    sel.value=actual;
  }
}

function eliminar(id){

  const d=datos().filter(x=>x.id!==id);

  guardarDatos(d);

  actualizarMeses();

  mostrar();
}

function mostrar(){

  const mes=document.getElementById("mes").value;

  const d=datos().filter(
    x=>mesClave(x.fecha)===mes
  );

  let extra=0;
  let debe=0;
  let pago=0;

  const tabla=document.getElementById("tabla");

  tabla.innerHTML="";

  d.forEach(x=>{

    extra+=x.extra;
    debe+=x.debe;
    pago+=x.importe;

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${x.fecha}</td>
      <td>${x.entrada}</td>
      <td>${x.salida}</td>
      <td>${hhmm(x.extra)}</td>
      <td>${hhmm(x.debe)}</td>
      <td>${euro(x.importe)}</td>
      <td>
        <button
        style="padding:7px;margin:0"
        onclick="eliminar(${x.id})">
        ✕
        </button>
      </td>
    `;

    tabla.appendChild(tr);

  });

  document.getElementById("extraTotal").textContent=
    hhmm(extra);

  document.getElementById("debeTotal").textContent=
    hhmm(debe);

  document.getElementById("pagoTotal").textContent=
    euro(pago);
}

function exportar(){

  const d=datos();

  if(!d.length){
    alert("No hay datos");
    return;
  }

  const contenido=
    JSON.stringify(d,null,2);

  const blob=
    new Blob(
      [contenido],
      {type:"application/json"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "copia-control-horario.json";

  a.click();

  URL.revokeObjectURL(url);
}

function borrarTodo(){

  if(
    confirm(
      "¿Seguro que quieres borrar todo el histórico?"
    )
  ){
    localStorage.removeItem(CLAVE);
    actualizarMeses();
    mostrar();
  }
}

document.getElementById("fecha").value=
  new Date().toISOString().slice(0,10);

actualizarMeses();
mostrar();

</script>

</body>
</html>
